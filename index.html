<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вика, 19 декабря</title>
<meta property="og:title" content="Приглашение на день рождения Вики ❄️">
<meta property="og:description" content="19 декабря в 20:00 во Flow Izakaya, около 22:30 едем в Legendar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;1,500;1,600&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: зимняя ночь — падающий снег на холсте, огромное курсивное имя, вечер как два огонька на вертикальной линии */
:root{
  --night:#0d1b2e; --night-2:#14273f; --frost:#e8eef6; --gold:#e4c58a; --muted:#8ea2bd;
  --display:"Cormorant","Cormorant Garamond",Georgia,serif; --body:"Manrope",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,#081322 0%,var(--night) 45%,#1a2d48 100%) fixed,var(--night);color:var(--frost);font:16px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(40px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:500px;margin:0 auto;text-align:center}
h1{font:italic 600 clamp(38px,12vw,88px)/.85 var(--display);margin:18px 0 6px;color:var(--frost);
  background:linear-gradient(180deg,#fff 20%,var(--gold) 110%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font:italic 500 26px/1.2 var(--display);color:var(--frost);margin:0}
.date{margin:30px auto 0;display:inline-flex;align-items:center;gap:16px;padding:12px 22px;border:1px solid rgba(228,197,138,.45);border-radius:999px;font-weight:500}
.date b{font:600 30px/1 var(--display);color:var(--gold)}
.date i{width:4px;height:4px;border-radius:50%;background:var(--gold)}
.route{margin:44px auto 0;text-align:left;position:relative;padding-left:34px;max-width:380px}
.route::before{content:"";position:absolute;left:8px;top:12px;bottom:40px;width:1px;background:linear-gradient(var(--gold),rgba(228,197,138,.15))}
.stop{position:relative;padding-bottom:30px}
.stop::before{content:"";position:absolute;left:-31px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px 3px rgba(228,197,138,.6)}
.time{font:600 13px var(--body);letter-spacing:.2em;color:var(--gold);font-variant-numeric:tabular-nums}
.place{font:600 34px/1.1 var(--display);margin:4px 0 2px}
.addr{margin:0;color:var(--muted)}
.stop a{display:inline-block;margin-top:8px;color:var(--frost);font-size:14px;text-decoration:none;border-bottom:1px solid var(--gold)}
.stop a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cd{margin-top:16px;display:flex;justify-content:center;gap:28px;font-variant-numeric:tabular-nums}
.cd b{display:block;font:600 46px/1 var(--display);color:var(--frost)}
.cd small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cd-label{margin:40px 0 0;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.sign{margin-top:44px;font:italic 500 24px var(--display);color:var(--frost)}

/* Motion: имя оттаивает из инея, затем золотая нить маршрута прорисовывается вниз и зажигает точки по очереди */
:root{--ease-out:cubic-bezier(0.16,1,0.3,1);--ease-io:cubic-bezier(0.77,0,0.175,1);--line-start:1600ms;--line-dur:2200ms}
@keyframes defrost{from{opacity:0;filter:blur(14px);transform:scale(1.04)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes draw{from{clip-path:inset(0 0 100% 0)}}
@keyframes ignite{0%{opacity:.25;transform:scale(.5);box-shadow:0 0 0 0 rgba(228,197,138,0)}60%{transform:scale(1.25);box-shadow:0 0 26px 8px rgba(228,197,138,.8)}}
@keyframes fade{from{opacity:0}}
h1{animation:defrost 1800ms var(--ease-out) 200ms both}
.sub{animation:rise 1000ms var(--ease-out) 800ms both}
.date{animation:rise 1000ms var(--ease-out) 1000ms both}
.route::before{animation:draw var(--line-dur) var(--ease-io) var(--line-start) both}
.stop::before{animation:ignite 1100ms var(--ease-out) both}
.stop>*{animation:rise 1000ms var(--ease-out) both}
.stop:nth-child(1)::before,.stop:nth-child(1)>*{animation-delay:calc(var(--line-start) + 120ms)}
.stop:nth-child(2)::before,.stop:nth-child(2)>*{animation-delay:calc(var(--line-start) + var(--line-dur) - 300ms)}
.cd-label,.cd,.sign{animation:fade 1100ms var(--ease-out) 3600ms both}
.stop a{transition:color 200ms ease,border-color 200ms ease,transform 160ms var(--ease-out)}
.stop a:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.stop a:hover{color:var(--gold)}}
.cd b{display:block}
@media (prefers-reduced-motion:reduce){
  h1,.sub,.date,.stop>*,.stop::before,.cd-label,.cd,.sign{animation:fade 400ms ease both}
  .route::before{animation:fade 400ms ease both}
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <h1>Приглашаю</h1>
  <p class="sub">на свой день рождения</p>
  <div class="date"><b>19</b> декабря <i></i> суббота</div>

  <div class="route" aria-label="Программа вечера">
    <div class="stop">
      <div class="time">20:00, ужин</div>
      <p class="place">Flow Izakaya</p>
      <p class="addr">ул. Октябрьская, 19а</p>
      <a href="https://yandex.by/maps/?text=Минск, Октябрьская улица, 19а" target="_blank" rel="noopener">Открыть на карте</a>
    </div>
    <div class="stop">
      <div class="time">Около 22:30, едем дальше</div>
      <p class="place">Legendar</p>
      <p class="addr">ул. Революционная, 14</p>
      <a href="https://yandex.by/maps/?text=Минск, Революционная улица, 14" target="_blank" rel="noopener">Открыть на карте</a>
    </div>
  </div>

  <p class="cd-label" id="cd-label">До встречи осталось</p>
  <div class="cd" id="cd"></div>

  <p class="sign">До встречи 19 декабря</p>
</div>
<script>
const T=new Date('2026-12-19T20:00:00+03:00');
const pl=(n,f)=>f[(n%10==1&&n%100!=11)?0:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?1:2];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const forms=[['день','дня','дней'],['час','часа','часов'],['минута','минуты','минут']];
const cd=document.getElementById('cd');
cd.innerHTML=forms.map(()=>'<div><b></b><small></small></div>').join('');
const cells=[...cd.children];
function tick(){
  const s=Math.floor((T-Date.now())/1000);
  if(s<=0){document.getElementById('cd-label').textContent='Это уже сегодня!';cd.innerHTML='';return}
  [Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60)].forEach((n,i)=>{
    const b=cells[i].firstChild;
    if(b.textContent===String(n))return;
    const first=!b.textContent;
    b.textContent=n;cells[i].lastChild.textContent=pl(n,forms[i]);
    // смена цифры проходит через лёгкий иней вместо резкого скачка
    if(!first&&!reduce)b.animate([{filter:'blur(6px)',opacity:.3,transform:'translateY(-6px)'},{filter:'blur(0)',opacity:1,transform:'none'}],{duration:700,easing:'cubic-bezier(0.16,1,0.3,1)'});
  });
}
tick();setInterval(tick,1000);

// снег в три слоя глубины: дальние хлопья мельче, тусклее и медленнее
const c=document.getElementById('snow'),x=c.getContext('2d');let W,H,dpr,last=0;
function size(){dpr=devicePixelRatio||1;W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}
size();addEventListener('resize',size);
const flakes=Array.from({length:110},()=>{const z=Math.random()**1.6;return{x:Math.random(),y:Math.random(),z,r:.5+z*2.6,v:.012+z*.04,a:.25+z*.6,d:Math.random()*6}});
function draw(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  x.clearRect(0,0,W,H);
  for(const f of flakes){
    f.y+=f.v*dt;if(f.y>1.02){f.y=-.02;f.x=Math.random()}
    x.globalAlpha=f.a;x.fillStyle='#e8eef6';
    x.beginPath();x.arc((f.x+Math.sin(t/(2600-f.z*900)+f.d)*.012*(1+f.z))*W,f.y*H,f.r*dpr,0,7);x.fill();
  }
  if(!reduce)requestAnimationFrame(draw);
}
requestAnimationFrame(t=>{last=t;draw(t)});
</script>
</body>
</html>
